name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
    - uses: actions/checkout@v4

    - name: Build dslibris.nds
      run: make

    - name: Package release ZIP
      run: |
        if ! command -v zip >/dev/null 2>&1; then
          apt-get update && apt-get install -y --no-install-recommends zip
        fi
        version=$(sed -n 's/^#define VERSION "\(.*\)"/\1/p' include/version.h)
        zipfile="dslibris-${version}.zip"
        rm -f "${zipfile}"
        zip "${zipfile}" dslibris.nds
        (cd etc/filesystem/en && zip -r -u "../../../${zipfile}" . -x '*.DS_Store')
        echo "ZIPFILE=${zipfile}" >> "$GITHUB_ENV"
        echo "VERSION=${version}" >> "$GITHUB_ENV"

    - name: Upload release ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: dslibris-${{ env.VERSION }}
        path: ${{ env.ZIPFILE }}

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIPFILE }}
